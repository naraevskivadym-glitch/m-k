<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вадим | Links</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:radial-gradient(circle at top,#222 0%,#0d0d0d 45%,#050505 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px;
}
.container{width:100%;max-width:430px;text-align:center}
.avatar{
    width:145px;height:145px;object-fit:cover;object-position:center;
    border-radius:50%;border:4px solid white;margin-bottom:25px;
    box-shadow:0 0 20px rgba(255,255,255,.25),0 0 50px rgba(255,255,255,.08);
}
h1{font-size:42px;font-weight:700;letter-spacing:1px;margin-bottom:7px}
.username{font-size:20px;color:#888;margin-bottom:45px}
.link{
    display:flex;align-items:center;width:100%;height:78px;margin-bottom:20px;
    padding:0 25px;color:white;text-decoration:none;background:rgba(20,20,20,.85);
    border:1px solid #444;border-radius:25px;box-shadow:0 5px 25px rgba(0,0,0,.5);
    transition:.25s ease;
}
.link:hover{transform:translateY(-4px) scale(1.02);border-color:#777;box-shadow:0 10px 35px rgba(255,255,255,.12)}
.icon{width:45px;height:45px;display:flex;justify-content:center;align-items:center;font-size:27px;margin-right:25px}
.separator{width:1px;height:38px;background:#555;margin-right:25px}
.link-text{font-size:20px;font-weight:600}
.arrow{margin-left:auto;font-size:32px;color:#ddd;transition:.25s}
.link:hover .arrow{transform:translateX(5px)}
.footer{margin-top:70px;color:#666;font-size:14px}
@media(max-width:500px){
.avatar{width:125px;height:125px}
h1{font-size:36px}
.username{font-size:18px;margin-bottom:35px}
.link{height:70px;border-radius:20px}
.link-text{font-size:18px}
.icon{margin-right:18px}
}
</style>
</head>
