<!DOCTYPE html>
<html lang="uk">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Борислава</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* =========================
   ТЕКСТ ЗВЕРХУ
========================= */

h1 {
    position: fixed;
    top: 25px;
    left: 0;

    width: 100%;

    margin: 0;

    text-align: center;

    color: white;

    font-size: 42px;
    font-weight: bold;

    z-index: 100;

    text-shadow:
        0 0 5px white,
        0 0 15px #ff8ed5,
        0 0 30px #ff35b5;
}


/* =========================
   СЕРЦЕ
========================= */

#ui {
    position: absolute;
    width: 100%;
    height: 100%;
}


/* =========================
   КОЖЕН I LOVE YOU
========================= */

.love {
    position: absolute;

    top: 42%;
    left: 50%;

    width: 0;
    height: 0;

    --i: 1;
}


/* Рух вліво-вправо */

.love_horizontal {

    animation:
        horizontal 10s infinite alternate ease-in-out;

    animation-delay:
        calc(var(--i) * -300ms);
}


/* Рух вгору-вниз */

.love_vertical {

    animation:
        vertical 20s infinite linear;

    animation-delay:
        calc(var(--i) * -300ms);
}


/* =========================
   I LOVE YOU
========================= */

.love_word {

    position: absolute;

    white-space: nowrap;

    color: #e978b0;

    font-size: 16px;

    font-weight: 500;

    letter-spacing: 0.5px;

    transform:
        translateY(-100%)
        rotate(-30deg);

    text-shadow:
        0 0 3px #ff6fbd,
        0 0 8px #ff69c7,
        0 0 15px #ff35b5;

    animation:
        glow 1.8s infinite alternate;

    animation-delay:
        calc(var(--i) * -120ms);
}


/* =========================
   ГОРИЗОНТАЛЬНИЙ РУХ
========================= */

@keyframes horizontal {

    from {
        transform: translateX(-245px);
    }

    to {
        transform: translateX(245px);
    }

}


/* =========================
   ФОРМА СЕРЦЯ
========================= */

@keyframes vertical {

    0% {
        transform: translateY(180px);
    }

    10% {
        transform: translateY(45px);
    }

    15% {
        transform: translateY(5px);
    }

    18% {
        transform: translateY(0);
    }

    20% {
        transform: translateY(5px);
    }

    22% {
        transform: translateY(35px);
    }

    24% {
        transform: translateY(64px);
    }

    25% {
        transform: translateY(112px);
    }

    26% {
        transform: translateY(64px);
    }

    28% {
        transform: translateY(35px);
    }

    30% {
        transform: translateY(5px);
    }

    32% {
        transform: translateY(0);
    }

    35% {
        transform: translateY(5px);
    }

    40% {
        transform: translateY(45px);
    }

    50% {
        transform: translateY(180px);
    }

    65% {
        transform: translateY(350px);
    }

    71% {
        transform: translateY(428px);
    }

    72.5% {
        transform: translateY(441px);
    }

    75% {
        transform: translateY(450px);
    }

    77.5% {
        transform: translateY(441px);
    }

    79% {
        transform: translateY(428px);
    }

    85% {
        transform: translateY(350px);
    }

    100% {
        transform: translateY(180px);
    }

}


/* =========================
   ПЕРЕЛИВАННЯ I LOVE YOU
========================= */

@keyframes glow {

    0% {

        color: #d85f9c;

        opacity: 0.5;

        text-shadow:
            0 0 3px #ff5fbb;
    }

    25% {

        color: #ffaadf;

        opacity: 0.8;

        text-shadow:
            0 0 5px #ff75c8,
            0 0 12px #ff3eb5;
    }

    50% {

        color: white;

        opacity: 1;

        text-shadow:
            0 0 5px white,
            0 0 12px #ffb1e3,
            0 0 22px #ff42b8;
    }

    75% {

        color: #ffb5e5;

        opacity: 0.9;

        text-shadow:
            0 0 5px #ff9ddd,
            0 0 15px #ff3db3;
    }

    100% {

        color: #df6da9;

        opacity: 0.55;

        text-shadow:
            0 0 3px #ff5fbb;
    }

}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 700px) {

    h1 {
        font-size: 27px;
        top: 20px;
    }

    .love_word {
        font-size: 10px;
    }

}

</style>

</head>


<body>


<!-- ТЕКСТ ЗВЕРХУ -->

<h1>
    Борислава прівеееееет
</h1>


<!-- СЕРЦЕ -->

<div id="ui"></div>


<script>

const ui = document.getElementById("ui");


/*
   Кількість I love you
*/

const totalItems = 130;


for (let i = 1; i <= totalItems; i++) {

    const love =
        document.createElement("div");

    love.className = "love";


    love.style.setProperty(
        "--i",
        i
    );


    love.innerHTML = `

        <div class="love_horizontal">

            <div class="love_vertical">

                <div class="love_word">
                    I love you
                </div>

            </div>

        </div>

    `;


    ui.appendChild(love);
}

</script>

</body>

</html>
